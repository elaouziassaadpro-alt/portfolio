<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assaad Elaouzi — IT & Application Developer, Casablanca</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07141f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <!-- Before first paint: apply a saved light theme, and send visitors
         landing on / to their language's page. Crawlers keep / (English). -->
    <script>
      try {
        if (localStorage.getItem("portfolio-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
        if (location.pathname === "/") {
          var lang = localStorage.getItem("portfolio-lang") || (navigator.language || "").slice(0, 2);
          if (lang === "fr" || lang === "es") location.replace("/" + lang + "/" + location.hash);
        }
      } catch (e) {}
    </script>
    <!-- Without JavaScript: load the fonts, and show the scroll-reveal content -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      />
      <style>
        [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
